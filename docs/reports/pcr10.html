<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Workcell report</title>

<style>:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --ink: #1b1f24;
  --muted: #5f6873;
  --line: #e2e5e9;
  --grid: rgba(20, 30, 40, .06);
  --track: rgba(20, 30, 40, .035);
  --accent: #3466d6;
  --accent-soft: rgba(52, 102, 214, .12);
  --red: #e0383e;
  --red-soft: rgba(224, 56, 62, .1);
  --amber: #b7791f;
  --green: #2f8f4e;
  --wait: rgba(110, 120, 135, .2);
  --code-bg: #f8f9fb;
  --sel: #11161c;
  --busy: #e08a2e;
  --chip-neutral: #dfe3e8;
  --chip-neutral-ink: #333a42;
  --shadow: 0 1px 2px rgba(15, 20, 30, .06), 0 1px 8px rgba(15, 20, 30, .04);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --label-w: 132px;
  --row-h: 20px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1014;
    --panel: #161a20;
    --ink: #e5e8ec;
    --muted: #98a1ac;
    --line: #29303a;
    --grid: rgba(255, 255, 255, .06);
    --track: rgba(255, 255, 255, .025);
    --accent: #6d9bff;
    --accent-soft: rgba(109, 155, 255, .16);
    --red: #ff5a5f;
    --red-soft: rgba(255, 90, 95, .12);
    --amber: #e0a43a;
    --green: #4cc27a;
    --wait: rgba(150, 160, 175, .16);
    --code-bg: #11151a;
    --sel: #ffffff;
    --chip-neutral: #3a414b;
    --chip-neutral-ink: #e5e8ec;
    --shadow: none;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
h1 { font-size: 18px; }
h2 { font-size: 14px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); }
button, select { font: inherit; color: inherit; }

/* ---------- header / transport ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 10px 24px 10px;
}
.top-row { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.brand p { margin: 0; font-size: 12px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.tab {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
  padding: 5px 10px; cursor: pointer; font-family: var(--mono); font-size: 12.5px;
}
.tab:hover { border-color: var(--muted); }
.tab[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

.badge {
  display: inline-block; border-radius: 999px; padding: 1px 8px;
  font: 600 11px/1.6 var(--sans); letter-spacing: .02em; white-space: nowrap;
  color: #fff; background: var(--muted);
}
.badge.complete, .badge.optimal { background: var(--green); }
.badge.feasible { background: var(--amber); }
.badge.deadlock, .badge.alarm { background: var(--red); }
.badge.no_solution, .badge.infeasible { background: var(--muted); }
.badge.incomplete { background: var(--amber); }

.transport { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
  padding: 4px 10px; cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn.sm { padding: 1px 7px; font-size: 12px; border-radius: 0; margin-left: -1px; }
.btn.sm:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.btn.sm:last-child { border-radius: 0 6px 6px 0; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); position: relative; }
.btn.play { width: 34px; height: 30px; padding: 0; display: grid; place-items: center; border-radius: 50%; }
.btn.play svg { width: 14px; height: 14px; fill: currentColor; }
.btn.play .i-pause, .btn.play.playing .i-play { display: none; }
.btn.play.playing .i-pause { display: block; }
.speed { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.speed select { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 2px 4px; color: var(--ink); }
.scrub { position: relative; flex: 1; height: 22px; cursor: pointer; touch-action: none; outline: none; }
.scrub-rail { position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: var(--line); }
.scrub-fill { position: absolute; left: 0; top: 9px; height: 4px; border-radius: 2px; background: var(--accent); width: 0; }
.scrub-knob {
  position: absolute; top: 4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--accent); left: 0;
}
.scrub:focus-visible .scrub-knob { box-shadow: 0 0 0 3px var(--accent-soft); }
.scrub-markers .mk { position: absolute; top: 2px; width: 2px; height: 18px; margin-left: -1px; background: var(--red); border-radius: 1px; }
.tnow { font: 12.5px var(--mono); min-width: 128px; text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- layout ---------- */
main { max-width: 1440px; margin: 0 auto; padding: 18px 24px 80px; display: flex; flex-direction: column; gap: 16px; }
#sec-run, #run-views { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
.card-h .zoom { margin-left: auto; display: flex; }
.empty { text-align: center; padding: 40px; color: var(--muted); }
.empty b { color: var(--ink); display: block; font-size: 16px; margin-bottom: 4px; }

.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; }
.legend i.hatch { background: repeating-linear-gradient(135deg, var(--muted) 0 2px, transparent 2px 5px); border: 1px solid var(--muted); }
.legend i.wait { background: var(--wait); }
.legend i.ghost { border: 1.5px dashed var(--red); }
.legend i.ghost.cycle { border: 2px solid var(--red); background: var(--red-soft); }
.legend i.borrowed { background: var(--chip-neutral); outline: 1.5px dashed var(--muted); outline-offset: -1.5px; }

/* ---------- alerts ---------- */
.alert { border: 1px solid var(--red); background: var(--red-soft); border-radius: 10px; padding: 12px 16px; }
.alert h3 { font-size: 14px; color: var(--red); margin-bottom: 6px; }
.alert p { margin: 0 0 6px; }
.alert .scroll { max-height: 240px; overflow-y: auto; }
.alert table { border-collapse: collapse; font-size: 13px; }
.alert td { padding: 3px 14px 3px 0; vertical-align: top; }
.alert .blk { font-family: var(--mono); cursor: pointer; color: var(--accent); white-space: nowrap; }
.alert .blk:hover { text-decoration: underline; }
.alert tr.cycle td { font-weight: 600; }
.alert .cyc-tag { font: 600 10px var(--sans); color: #fff; background: var(--red); border-radius: 999px; padding: 0 6px; }
.alert .cycle-line { margin: 4px 0 8px; }
.errors { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 10%, transparent); }
.errors h3 { color: var(--amber); }
.errors ul { margin: 0; padding-left: 18px; font: 12px var(--mono); }

/* ---------- stats ---------- */
.table-wrap { overflow-x: auto; }
table.stats { border-collapse: collapse; font-size: 13px; min-width: 100%; }
table.stats th, table.stats td { padding: 6px 14px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.stats th:first-child, table.stats td:first-child { text-align: left; color: var(--muted); font-weight: 500; }
table.stats thead th { font: 600 12.5px var(--mono); cursor: pointer; vertical-align: bottom; }
table.stats thead th .badge { margin-top: 3px; }
table.stats td { font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.stats .active { background: var(--accent-soft); }
table.stats .best { font-weight: 700; }
table.stats .best::after { content: " ★"; color: var(--amber); font-size: 11px; }
table.stats td.alarm-msg { white-space: normal; max-width: 260px; text-align: left; color: var(--red); font-size: 12px; }
.util { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 4px 28px; }
.ub { display: grid; grid-template-columns: 80px 1fr 44px 76px; align-items: center; gap: 8px; font: 12px var(--mono); }
.ub .rail { display: flex; height: 9px; border-radius: 3px; background: var(--track); border: 1px solid var(--line); overflow: hidden; }
.ub .fill { height: 100%; border-radius: 2px; flex: none; }
.ub .fill.blocked { border-radius: 0 2px 2px 0; background: repeating-linear-gradient(135deg, var(--c) 0 2px, transparent 2px 4px); opacity: .75; }
.ub .blk-m { color: var(--red); font-size: 11px; white-space: nowrap; }
.ub .pct { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- gantt ---------- */
.gantt { position: relative; }
.g-scroll { overflow-x: auto; overflow-y: hidden; }
.g-inner { position: relative; min-width: 100%; user-select: none; }
.g-row { display: flex; height: var(--row-h); align-items: center; padding-right: 10px; }
.g-row + .g-row { border-top: 1px solid var(--grid); }
.g-label {
  position: sticky; left: 0; z-index: 3; flex: none; width: var(--label-w); height: 100%;
  display: flex; align-items: center; gap: 6px; padding-right: 8px;
  background: var(--panel); font: 11.5px var(--mono); white-space: nowrap; overflow: hidden;
}
.g-label .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.g-label .sub { color: var(--muted); font-size: 10.5px; margin-left: auto; }
.g-track { position: relative; flex: 1; height: 100%; background: var(--track); cursor: crosshair; }
.g-axis { display: flex; height: 18px; padding-right: 10px; }
.g-axis .g-label { font-size: 10.5px; color: var(--muted); }
.g-axis .g-track { background: none; }
.tick { position: absolute; top: 2px; font: 10.5px var(--mono); color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
.tick:first-child { transform: none; }
.gridline { position: absolute; top: 18px; bottom: 0; width: 1px; background: var(--grid); pointer-events: none; }
.bar {
  position: absolute; top: 3px; bottom: 3px; min-width: 2px; border-radius: 2px;
  cursor: pointer;
}
.bar.ins { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.55) 0 2px, transparent 2px 5px) !important; }
.bar.waitspan { top: 6px; bottom: 6px; background: var(--wait); cursor: crosshair; border-radius: 3px; pointer-events: none; }
.bar.ghost { background: transparent; border: 1.5px dashed var(--red); }
.bar.ghost.cycle { background: var(--red-soft); border: 2px solid var(--red); }
.bar.alarm { box-shadow: 0 0 0 2px var(--red); }
.bar.sel { box-shadow: 0 0 0 2px var(--sel); z-index: 2; }
.g-inner.has-sel .bar:not(.sel):not(.waitspan) { opacity: .35; }
.g-overlay { position: absolute; top: 0; bottom: 0; left: var(--label-w); right: 10px; pointer-events: none; z-index: 4; }
.cursor { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px solid var(--accent); }
.cursor::before {
  content: ""; position: absolute; top: 12px; left: -5px;
  border: 4px solid transparent; border-top: 6px solid var(--accent);
}
.marker { position: absolute; top: 14px; bottom: 0; width: 0; border-left: 2px solid var(--red); }
.marker span {
  position: absolute; top: 0; left: 4px; font: 600 10px var(--mono); color: #fff; background: var(--red);
  padding: 0 4px; border-radius: 3px; white-space: nowrap;
}

/* ---------- floor plan ---------- */
.floor { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
.fgroup { display: flex; flex-direction: column; gap: 6px; }
.fgroup > h3 { font: 600 10.5px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.fgroup .members { display: flex; gap: 10px; flex-wrap: wrap; }
.inst {
  border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 8px 8px; min-width: 128px;
  background: var(--panel); transition: border-color .15s, box-shadow .15s;
}
.inst.wide { width: 360px; }
.inst.busy { border-color: var(--busy); box-shadow: 0 0 0 3px color-mix(in srgb, var(--busy) 22%, transparent); }
.inst .ih { display: flex; align-items: baseline; gap: 6px; font: 600 12px var(--mono); }
.inst .ih .cap { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 11px; }
.inst .now { font: 10.5px var(--mono); color: var(--muted); height: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 100%; }
.inst.busy .now { color: var(--busy); }
.inst.wide .now { max-width: 340px; }
.inst:not(.wide) .now { max-width: 200px; }
.slots { display: flex; gap: 6px; margin-top: 4px; }
.slot {
  min-width: 58px; min-height: 26px; border: 1px dashed var(--line); border-radius: 5px; padding: 3px;
  display: flex; flex-wrap: wrap; gap: 3px; align-content: flex-start; position: relative;
}
.slot:has(.sl) { padding-bottom: 13px; }
.slot .sl { position: absolute; bottom: 0; right: 4px; font: 9.5px var(--mono); color: var(--muted); }
.inst.wide .slot { flex: 1; max-height: 140px; overflow-y: auto; }
.plate {
  font: 600 10px/18px var(--mono); height: 18px; padding: 0 5px; border-radius: 4px; color: #fff;
  white-space: nowrap; cursor: default;
}
.plate.dark-ink { color: #14181d; }
.plate.borrowed { background: var(--chip-neutral); color: var(--chip-neutral-ink); outline: 1.5px dashed var(--muted); outline-offset: -1.5px; }
.plate.sel { box-shadow: 0 0 0 2px var(--sel); }
.floor-note { font: 12px var(--mono); color: var(--red); margin-top: 10px; min-height: 16px; }

/* ---------- source ---------- */
.subtabs { display: flex; margin-left: auto; }
.subtab { border: 1px solid var(--line); background: var(--panel); padding: 2px 10px; font-size: 12px; cursor: pointer; margin-left: -1px; }
.subtab:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.subtab:last-child { border-radius: 0 6px 6px 0; }
.subtab.on { background: var(--accent-soft); border-color: var(--accent); position: relative; }
.src .highlight { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; max-height: 560px; }
.src .highlight pre { margin: 0; padding: 12px 14px; font: 12.5px/1.55 var(--mono); }
.src .highlight span.linenos { background: transparent; color: var(--muted); opacity: .55; padding-right: 12px; }

/* ---------- compiled ---------- */
details.wf { border-top: 1px solid var(--line); }
details.wf:first-of-type { border-top: 0; }
details.wf > summary { cursor: pointer; padding: 8px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; list-style: none; }
details.wf > summary::-webkit-details-marker { display: none; }
details.wf > summary::before { content: "▸"; color: var(--muted); width: 10px; transition: transform .15s; }
details.wf[open] > summary::before { transform: rotate(90deg); }
.wf-id { font: 600 13px var(--mono); display: inline-flex; align-items: center; gap: 6px; }
.wf-id .sw { width: 10px; height: 10px; border-radius: 3px; }
.wf-call { font: 12px var(--mono); color: var(--muted); }
.pchips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.vars { font: 12px var(--mono); margin: 2px 0 10px 20px; display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); }
.vars b { color: var(--ink); font-weight: 600; }
.vars .bind { color: var(--ink); }
table.blocks { border-collapse: collapse; width: calc(100% - 20px); margin: 0 0 12px 20px; font-size: 12px; }
table.blocks th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; padding: 3px 8px; border-bottom: 1px solid var(--line); }
table.blocks td { padding: 4px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
table.blocks tr.blk { cursor: pointer; }
table.blocks tr.blk:hover td { background: var(--track); }
table.blocks tr.sel td { background: var(--accent-soft); }
table.blocks tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
table.blocks tr.waiting td:first-child { box-shadow: inset 3px 0 0 var(--red); }
table.blocks tr.waiting .bid::after { content: " waiting"; color: var(--red); font: 600 10px var(--sans); }
table.blocks tr.waiting.cycle td:first-child { box-shadow: inset 5px 0 0 var(--red); }
table.blocks tr.waiting.cycle .bid::after { content: " waiting · cycle"; }
table.blocks tr.notrun { opacity: .55; }
.bid, .dur, .deps { font-family: var(--mono); white-space: nowrap; }
.dur { text-align: right; }
.deps a { color: var(--accent); cursor: pointer; text-decoration: none; }
.deps a:hover { text-decoration: underline; }
.kind { display: inline-block; font: 600 10px/16px var(--sans); text-transform: uppercase; letter-spacing: .05em; padding: 0 6px; border-radius: 4px; background: var(--track); border: 1px solid var(--line); }
.res { display: flex; gap: 3px; flex-wrap: wrap; }
.rchip { font: 10.5px/16px var(--mono); padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); white-space: nowrap; }
.rchip.var { border-style: dashed; }
ol.instr { margin: 0; padding-left: 0; list-style: none; font: 11.5px/1.55 var(--mono); }
ol.instr li { white-space: nowrap; }
ol.instr li.zero { color: var(--muted); }
ol.instr .op { font-weight: 600; }
ol.instr .d { color: var(--muted); }

/* ---------- tooltip ---------- */
.tip {
  position: fixed; z-index: 50; pointer-events: none; max-width: 460px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, .18); font-size: 12px;
}
.tip .tt { font-weight: 600; margin-bottom: 2px; }
.tip .tm { font: 11px var(--mono); color: var(--muted); margin-bottom: 4px; }
.tip ol.instr li { white-space: normal; }

<body>
<header class="top">
  <div class="top-row">
    <div class="brand">
      <h1>Workcell report</h1>
      <p id="summary" class="muted"></p>
    </div>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Scheduling mode"></nav>
  </div>
  <div class="transport" id="transport">
    <button id="play" class="btn play" type="button" title="Play / pause (space)" aria-label="Play">
      <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>
      <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/></svg>
    </button>
    <label class="speed">speed
      <select id="speed" aria-label="Playback speed"></select>
    </label>
    <div id="scrub" class="scrub" tabindex="0" role="slider" aria-label="Time" aria-valuemin="0">
      <div class="scrub-rail"></div>
      <div class="scrub-fill"></div>
      <div class="scrub-markers"></div>
      <div class="scrub-knob"></div>
    </div>
    <output id="tnow" class="tnow">t = 0 min</output>
  </div>
</header>

<main>
  <section class="card" id="sec-stats">
    <div class="card-h"><h2>Mode comparison</h2><span class="muted small">click a column to switch mode</span></div>
    <div class="table-wrap"><table id="stats-table" class="stats"></table></div>
  </section>

  <section id="sec-run">
    <div id="run-alerts"></div>
    <div id="run-empty" class="card empty" hidden></div>
    <div id="run-views">
      <div class="card">
        <div class="card-h"><h2>Instrument utilization</h2><span id="util-note" class="muted small"></span></div>
        <div id="util" class="util"></div>
      </div>
      <div class="card">
        <div class="card-h">
          <h2>Gantt by instrument</h2>
          <div class="legend" id="legend-inst"></div>
          <div class="zoom" role="group" aria-label="Zoom">
            <button type="button" class="btn sm" data-zoom="1">fit</button><button type="button" class="btn sm" data-zoom="2">2&times;</button><button type="button" class="btn sm" data-zoom="4">4&times;</button><button type="button" class="btn sm" data-zoom="8">8&times;</button>
          </div>
        </div>
        <div id="gantt-inst" class="gantt"></div>
      </div>
      <div class="card">
        <div class="card-h"><h2>Gantt by workflow</h2><div class="legend" id="legend-wf"></div></div>
        <div id="gantt-wf" class="gantt"></div>
      </div>
      <div class="card">
        <div class="card-h"><h2>Floor plan</h2><div class="legend" id="legend-floor"></div></div>
        <div id="floor" class="floor"></div>
      </div>
    </div>
  </section>

  <section class="card" id="sec-source">
    <div class="card-h">
      <h2>Source</h2>
      <div class="subtabs" id="src-tabs" role="tablist">
        <button type="button" class="subtab" data-src="workflows">workflows</button><button type="button" class="subtab" data-src="batch">batch</button><button type="button" class="subtab" data-src="workcell">workcell</button>
      </div>
    </div>
    <div id="src" class="src"></div>
  </section>

  <section class="card" id="sec-compiled">
    <div class="card-h"><h2>Compiled blocks</h2><span class="muted small">click a block to highlight its bars; click a bar to jump here</span></div>
    <div id="compiled"></div>
  </section>
</main>

<script>(function () {
  "use strict";

  const D = JSON.parse(document.getElementById("workcell-data").textContent);
  const $ = (sel, el) => (el || document).querySelector(sel);
  const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));
  const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  const esc = s => String(s).replace(/[&<>"']/g, c => ESC[c]);
  const attr = s => (window.CSS && CSS.escape ? CSS.escape(s) : String(s).replace(/["\\]/g, "\\$&"));

  // ---------------------------------------------------------------- lookups
  const TYPE_ORDER = ["storage", "hotel", "arm", "barcode_scanner", "head_stamper", "thermocycler"];
  const TYPE_COLOR = {
    arm: "#e08a2e", storage: "#7d9440", hotel: "#8b6cc4",
    barcode_scanner: "#c05299", head_stamper: "#3b7dd8", thermocycler: "#1f9e89",
  };
  const TYPE_LABEL = {
    arm: "arm", storage: "storage", hotel: "hotel", barcode_scanner: "scanner",
    head_stamper: "stamper", thermocycler: "thermocycler",
  };
  const STATUS_LABEL = {
    complete: "complete", optimal: "optimal", feasible: "feasible",
    deadlock: "deadlock", no_solution: "no solution", infeasible: "infeasible", alarm: "alarm",
    incomplete: "incomplete",
  };
  const FINISHED = new Set(["complete", "optimal", "feasible"]);
  const SPEEDS = [0.5, 1, 2, 5, 10, 20, 50, 100, 200];

  const instById = Object.fromEntries(D.instruments.map(i => [i.id, i]));
  const typeRank = t => { const r = TYPE_ORDER.indexOf(t); return r < 0 ? 99 : r; };
  const instSorted = D.instruments.map((inst, i) => [inst, i])
    .sort((a, b) => typeRank(a[0].type) - typeRank(b[0].type) || a[1] - b[1]).map(x => x[0]);
  const instType = id => (instById[id] ? instById[id].type : "");
  const instColor = id => TYPE_COLOR[instType(id)] || "#888";

  const wfIndex = Object.fromEntries(D.workflows.map((w, i) => [w.id, i]));
  const hue = i => (i * 137.508 + 210) % 360;
  const wfColor = i => `hsl(${hue(i).toFixed(1)} 62% 52%)`;
  const wfDarkInk = i => { const h = hue(i); return h > 40 && h < 195; };
  const plateOwner = {};
  const plateBorrowers = {};
  D.workflows.forEach((w, i) => {
    w.owned.forEach(p => { plateOwner[p] = i; });
    w.borrowed.forEach(p => { (plateBorrowers[p] = plateBorrowers[p] || []).push(w.id); });
  });
  const compiledById = {};
  const blockWf = {};
  D.compiled.forEach(c => c.blocks.forEach(b => { compiledById[b.id] = b; blockWf[b.id] = c.workflow; }));
  const baseId = id => id.replace(/\.park$/, "");
  const wfOf = id => blockWf[baseId(id)] || id.slice(0, id.lastIndexOf("/"));
  const statusOf = run => run.stats.status;

  function primaryType(b) {
    const ins = b.instructions || [];
    if (ins.some(i => i.op === "move" && instType(i.instrument) === "arm")) return "arm";
    const real = ins.find(i => i.duration > 0) || ins[0];
    return real ? instType(real.instrument) : instType(b.instruments[0]);
  }

  // ---------------------------------------------------------------- formatting
  function fmtVal(v) {
    if (Array.isArray(v)) {
      if (v.length > 4) return `[${v.length} steps]`;
      return "(" + v.map(fmtVal).join(", ") + ")";
    }
    if (v && typeof v === "object") return "{…}";
    return String(v);
  }
  function fmtInstr(i) {
    const args = Object.entries(i.args || {}).map(([k, v]) => `${esc(k)}=${esc(fmtVal(v))}`).join(", ");
    return `<li class="${i.duration ? "" : "zero"}">${esc(i.instrument)}.<span class="op">${esc(i.op)}</span>(${args}) <span class="d">${i.duration}m</span></li>`;
  }
  const fmtNum = (v, d) => (v === null || v === undefined ? "—" : (d ? Number(v).toFixed(d) : String(v)));
  const badge = s => `<span class="badge ${esc(s)}">${esc(STATUS_LABEL[s] || s)}</span>`;
  const pct = (x, T) => (100 * x / T) + "%";
  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1e-9))));
    for (const m of [1, 2, 5, 10]) if (m * p >= raw) return Math.max(1, m * p);
    return 10 * p;
  }

  // ---------------------------------------------------------------- per-run prep (cached)
  function lastAtOrBefore(arr, key, t) {   // arr sorted by key; index of last item with item[key] <= t
    let lo = 0, hi = arr.length - 1, ans = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (arr[mid][key] <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return ans;
  }

  function prep(run) {
    if (run._p) return run._p;
    const byId = {};
    let T = run.stats.makespan || 0;
    run.blocks.forEach(b => { byId[b.id] = b; T = Math.max(T, b.end); });
    const ghosts = [];
    const cycle = new Set(run.deadlock ? run.deadlock.cycle || [] : []);
    if (run.deadlock) {
      const t0 = run.deadlock.time;
      run.deadlock.waits.forEach(w => {
        const c = compiledById[baseId(w.block)];
        const dur = Math.max(1, c ? c.duration : 1);
        const g = { id: w.block, workflow: wfOf(w.block), kind: c ? c.kind : "", label: c ? c.label : w.block,
          start: t0, end: t0 + dur, reason: w.reason, ghost: true, cycle: cycle.has(w.block), instructions: c ? c.instructions : [],
          instruments: c ? c.instruments : [], plates: c ? c.plates : [] };
        ghosts.push(g); byId[g.id] = byId[g.id] || g;
        T = Math.max(T, g.end);
      });
      T = Math.max(T, t0);
    }
    if (run.alarm) T = Math.max(T, run.alarm.time);
    T = Math.max(T, 1);
    const plateMoves = {};
    run.moves.forEach(m => { (plateMoves[m.plate] = plateMoves[m.plate] || []).push(m); });
    Object.values(plateMoves).forEach(a => a.sort((x, y) => x.time - y.time));
    const instBlocks = {};
    run.blocks.forEach(b => b.instruments.forEach(i => { (instBlocks[i] = instBlocks[i] || []).push(b); }));
    Object.values(instBlocks).forEach(a => a.sort((x, y) => x.start - y.start));
    const markers = [];
    if (run.deadlock) markers.push({ time: run.deadlock.time, label: `deadlock t=${run.deadlock.time}` });
    if (run.alarm) markers.push({ time: run.alarm.time, label: `alarm t=${run.alarm.time}` });
    return (run._p = { T, byId, ghosts, cycle, plateMoves, instBlocks, markers });
  }

  // ---------------------------------------------------------------- state
  const S = { run: 0, t: 0, playing: false, speed: null, speedTouched: false, zoom: 1, sel: null, cursors: [] };
  const R = () => D.runs[S.run];
  const P = () => prep(R());

  // ---------------------------------------------------------------- header, tabs, stats
  $("#summary").textContent =
    `${D.workflows.length} workflow${D.workflows.length === 1 ? "" : "s"} · ${D.instruments.length} instruments · ${D.runs.length} mode${D.runs.length === 1 ? "" : "s"}`;

  function renderTabs() {
    $("#tabs").innerHTML = D.runs.map((r, i) =>
      `<button type="button" class="tab" role="tab" data-run="${i}" aria-selected="${i === S.run}">${esc(r.mode)} ${badge(statusOf(r))}</button>`
    ).join("");
  }
  $("#tabs").addEventListener("click", e => {
    const b = e.target.closest("[data-run]");
    if (b) setRun(+b.dataset.run);
  });

  function renderStats() {
    const runs = D.runs;
    const finished = runs.filter(r => FINISHED.has(statusOf(r)));
    const best = finished.length > 1 ? Math.min(...finished.map(r => r.stats.makespan)) : null;
    const rows = [
      ["status", r => badge(statusOf(r))],
      ["makespan", r => `<span class="${best !== null && FINISHED.has(statusOf(r)) && r.stats.makespan === best ? "best" : ""}">${r.stats.makespan} min</span>`],
      ["completed", r => `${r.stats.completed} / ${r.stats.total}`],
      ["mean latency", r => (r.stats.mean_latency === null ? "—" : `${fmtNum(r.stats.mean_latency, 1)} min`)],
      ["max latency", r => (r.stats.max_latency === null ? "—" : `${r.stats.max_latency} min`)],
      ["mean completion", r => (r.stats.mean_completion === null ? "—" : `${fmtNum(r.stats.mean_completion, 1)} min`)],
      ["waiting (total)", r => (r.stats.total_waiting === null ? "—" : `${r.stats.total_waiting} min`)],
      ["waiting (mean)", r => (r.stats.mean_waiting === null ? "—" : `${fmtNum(r.stats.mean_waiting, 1)} min`)],
      ["blocked (total)", r => `${Object.values(r.stats.blocked || {}).reduce((a, b) => a + b, 0)} min`],
      ["solver status", r => esc(STATUS_LABEL[r.status] || r.status)],
      ["solve time", r => `${Number(r.stats.solve_seconds).toFixed(2)} s`],
      ["lock waits", r => String(r.stats.lock_waits)],
      ["alarm", r => (r.stats.alarm ? esc(r.stats.alarm) : "—")],
    ];
    const head = `<thead><tr><th></th>${runs.map((r, i) => `<th data-run="${i}">${esc(r.mode)}</th>`).join("")}</tr></thead>`;
    const body = rows.map(([name, f]) => `<tr><td>${name}</td>${runs.map((r, i) =>
      `<td data-run="${i}" class="${name === "alarm" && r.stats.alarm ? "alarm-msg" : ""}">${f(r)}</td>`).join("")}</tr>`).join("");
    const t = $("#stats-table");
    t.innerHTML = head + `<tbody>${body}</tbody>`;
    t.addEventListener("click", e => {
      const c = e.target.closest("[data-run]");
      if (c) setRun(+c.dataset.run);
    });
  }
  function markStatsActive() {
    $$("#stats-table [data-run]").forEach(c => c.classList.toggle("active", +c.dataset.run === S.run));
  }

  function renderUtil() {
    const run = R();
    const u = run.stats.utilization || {};
    const bl = run.stats.blocked || {};
    const T = run.stats.makespan || 0;
    $("#util").innerHTML = instSorted.map(inst => {
      const v = u[inst.id] || 0;
      const has = inst.id in bl, m = bl[inst.id] || 0, bv = T ? m / T : 0;
      const title = has ? `${m} min holding a plate while idle (blocked)` : "";
      return `<div class="ub" title="${esc(title)}"><span title="${esc(inst.type)}">${esc(inst.id)}</span><div class="rail"><div class="fill" style="width:${(100 * v).toFixed(1)}%;background:${instColor(inst.id)}"></div><div class="fill blocked" style="width:${(100 * bv).toFixed(1)}%;--c:${instColor(inst.id)}"></div></div><span class="pct">${Math.round(100 * v)}%</span><span class="blk-m">${has ? (m ? `${m}m blocked` : "—") : ""}</span></div>`;
    }).join("");
    $("#util-note").textContent = `${run.mode} · solid: busy time / makespan (${run.stats.makespan} min) · hatched: blocked, a plate rests in the instrument while it is idle`;
  }

  // ---------------------------------------------------------------- alerts
  function renderAlerts() {
    const run = R();
    const parts = [];
    if (run.deadlock) {
      const dl = run.deadlock;
      const cyc = dl.cycle || [];
      const rank = id => { const i = cyc.indexOf(id); return i < 0 ? cyc.length : i; };
      const waits = dl.waits.map((w, i) => [w, i]).sort((a, b) => rank(a[0].block) - rank(b[0].block) || a[1] - b[1]).map(x => x[0]);
      const cycText = cyc.length
        ? `<p class="cycle-line"><b>Wait cycle:</b> ${[...cyc, cyc[0]].map(id => `<span class="blk" data-sel="${esc(id)}">${esc(id)}</span>`).join(" → ")} <span class="muted small">(each waits for something held by the next one's workflow)</span></p>`
        : "";
      parts.push(`<div class="alert"><h3>Deadlock at t=${dl.time}</h3>
        <p>Work remains but nothing is running and nothing can start. ${run.stats.completed}/${run.stats.total} workflows complete. Waiting blocks (dashed red on the workflow Gantt; the wait cycle is solid red and listed first):</p>
        ${cycText}
        <div class="scroll"><table>${waits.map(w => {
          const c = compiledById[baseId(w.block)];
          const inCycle = cyc.includes(w.block);
          return `<tr class="${inCycle ? "cycle" : ""}"><td><span class="blk" data-sel="${esc(w.block)}">${esc(w.block)}</span>${inCycle ? ' <span class="cyc-tag">cycle</span>' : ""}</td><td>${esc(c ? c.label : "")}</td><td class="muted">${esc(w.reason)}</td></tr>`;
        }).join("")}</table></div></div>`);
    }
    if (run.alarm) {
      const a = run.alarm;
      parts.push(`<div class="alert"><h3>Alarm at t=${a.time}</h3><p>${esc(a.message)}</p>
        <table><tr><td class="muted">block</td><td><span class="blk" data-sel="${esc(a.block)}">${esc(a.block)}</span></td></tr>
        <tr><td class="muted">instruction</td><td class="mono">${esc(a.instrument)}.${esc(a.op)}</td></tr></table>
        <p class="muted small">The run halted here; everything after t=${a.time} did not happen.</p></div>`);
    }
    if (run.errors && run.errors.length) {
      parts.push(`<div class="alert errors"><h3>Plan validation errors (${run.errors.length})</h3><ul>${run.errors.map(e => `<li>${esc(e)}</li>`).join("")}</ul></div>`);
    }
    const el = $("#run-alerts");
    el.innerHTML = parts.join("");
    el.hidden = !parts.length;
  }
  $("#run-alerts").addEventListener("click", e => {
    const b = e.target.closest("[data-sel]");
    if (b) select(b.dataset.sel, true, true);
  });

  // ---------------------------------------------------------------- gantt
  function ganttShell(T, rowsHtml) {
    const step = niceStep(T / (8 * S.zoom));
    let ticks = "", grid = "";
    for (let x = 0; x <= T + 1e-9; x += step) {
      ticks += `<span class="tick" style="left:${pct(x, T)}">${x}</span>`;
      if (x > 0) grid += `<div class="gridline" style="left:${pct(x, T)}"></div>`;
    }
    const markers = P().markers.map(m =>
      `<div class="marker" style="left:${pct(m.time, T)}"><span>${esc(m.label)}</span></div>`).join("");
    return `<div class="g-scroll"><div class="g-inner" style="width:${S.zoom * 100}%">
      <div class="g-axis"><div class="g-label">min</div><div class="g-track">${ticks}</div></div>
      ${rowsHtml}
      <div class="g-overlay">${grid}${markers}<div class="cursor"></div></div>
    </div></div>`;
  }
  const row = (label, bars) => `<div class="g-row"><div class="g-label">${label}</div><div class="g-track">${bars}</div></div>`;

  function barHtml(b, color, T, extra) {
    const cls = ["bar"];
    if (b.inserted) cls.push("ins");
    if (b.ghost) cls.push("ghost");
    if (b.cycle) cls.push("cycle");
    const run = R();
    if (run.alarm && run.alarm.block === b.id) cls.push("alarm");
    if (extra) cls.push(extra);
    const bg = b.ghost ? "" : `background:${color};`;
    return `<div class="${cls.join(" ")}" data-b="${esc(b.id)}" style="left:${pct(b.start, T)};width:${pct(Math.max(b.end - b.start, 0), T)};${bg}"></div>`;
  }

  function renderGantts() {
    const run = R(), p = P(), T = p.T;
    const byInst = instSorted.map(inst => {
      const bars = (p.instBlocks[inst.id] || []).map(b => barHtml(b, wfColor(wfIndex[b.workflow] || 0), T)).join("");
      return row(`<span class="sw" style="background:${instColor(inst.id)}"></span>${esc(inst.id)}<span class="sub">${esc(TYPE_LABEL[inst.type] || inst.type)}</span>`, bars);
    }).join("");
    $("#gantt-inst").innerHTML = ganttShell(T, byInst);

    const perWf = {};
    run.blocks.forEach(b => { (perWf[b.workflow] = perWf[b.workflow] || []).push(b); });
    const ghostsWf = {};
    p.ghosts.forEach(g => { (ghostsWf[g.workflow] = ghostsWf[g.workflow] || []).push(g); });
    const byWf = D.workflows.map((w, i) => {
      const mine = perWf[w.id] || [];
      let bars = "";
      if (mine.length) {
        const s = Math.min(...mine.map(b => b.start)), e = Math.max(...mine.map(b => b.end));
        bars += `<div class="bar waitspan" style="left:${pct(s, T)};width:${pct(e - s, T)}"></div>`;
      }
      bars += mine.map(b => barHtml(b, TYPE_COLOR[primaryType(b)] || "#888", T)).join("");
      bars += (ghostsWf[w.id] || []).map(g => barHtml(g, "", T)).join("");
      const lat = run.stats.latency ? run.stats.latency[w.id] : null;
      return row(`<span class="sw" style="background:${wfColor(i)}"></span>${esc(w.id)}<span class="sub">${lat === null || lat === undefined ? "—" : lat + "m"}</span>`, bars);
    }).join("");
    $("#gantt-wf").innerHTML = ganttShell(T, byWf);

    S.cursors = $$(".gantt .cursor");
    applySelection(false);
  }

  function renderLegends() {
    const wfs = D.workflows;
    const wfPart = wfs.length <= 12
      ? wfs.map((w, i) => `<span><i style="background:${wfColor(i)}"></i>${esc(w.id)}</span>`).join("")
      : `<span><i style="background:linear-gradient(90deg,${[0, 1, 2, 3, 4].map(wfColor).join(",")})"></i>colored by workflow (${wfs.length})</span>`;
    $("#legend-inst").innerHTML = wfPart + `<span><i class="hatch"></i>planner-inserted</span>`;
    const types = [...new Set(D.instruments.map(i => i.type))].sort((a, b) => typeRank(a) - typeRank(b));
    $("#legend-wf").innerHTML = types.map(t => `<span><i style="background:${TYPE_COLOR[t] || "#888"}"></i>${esc(TYPE_LABEL[t] || t)}</span>`).join("")
      + `<span><i class="wait"></i>waiting</span>` + (P().ghosts.length ? `<span><i class="ghost"></i>blocked at deadlock</span>` : "")
      + (P().cycle.size ? `<span><i class="ghost cycle"></i>deadlock wait cycle</span>` : "");
    $("#legend-floor").innerHTML = `<span><i style="background:${wfColor(0)}"></i>owned plate (workflow color)</span><span><i class="borrowed"></i>borrowed / shared</span><span><i style="border:1.5px solid var(--busy)"></i>busy</span>`;
  }

  // gantt interaction: click / drag to seek, click a bar to select
  function trackFrac(gantt, clientX) {
    const ov = $(".g-overlay", gantt);
    const r = ov.getBoundingClientRect();
    return Math.min(1, Math.max(0, (clientX - r.left) / r.width));
  }
  ["#gantt-inst", "#gantt-wf"].forEach(sel => {
    const g = $(sel);
    let drag = null;
    g.addEventListener("pointerdown", e => {
      if (!e.target.closest(".g-track") || e.button !== 0) return;
      drag = { x: e.clientX, bar: e.target.closest(".bar[data-b]") };
      g.setPointerCapture(e.pointerId);
      setTime(trackFrac(g, e.clientX) * P().T);
      e.preventDefault();
    });
    g.addEventListener("pointermove", e => {
      if (drag) { setTime(trackFrac(g, e.clientX) * P().T); hideTip(); }
      else showTip(e);
    });
    g.addEventListener("pointerup", e => {
      if (drag && drag.bar && Math.abs(e.clientX - drag.x) < 4) select(drag.bar.dataset.b, true, true);
      drag = null;
    });
    g.addEventListener("pointerleave", hideTip);
  });

  // ---------------------------------------------------------------- tooltip
  const tip = $("#tip");
  function showTip(e) {
    const bar = e.target.closest && e.target.closest(".bar[data-b]");
    if (!bar) return hideTip();
    const b = P().byId[bar.dataset.b];
    if (!b) return hideTip();
    const head = b.ghost
      ? `waiting since t=${b.start}${b.cycle ? " · in the wait cycle" : ""} · ${esc(b.reason)}`
      : `${esc(b.id)} · ${esc(b.kind)}${b.inserted ? " · planner-inserted" : ""} · t ${b.start}–${b.end} (${b.end - b.start} min)`;
    tip.innerHTML = `<div class="tt">${esc(b.workflow)} · ${esc(b.label)}</div><div class="tm">${head}</div>
      <div class="tm">locks: ${esc([...b.instruments, ...b.plates].join(", "))}</div>
      <ol class="instr">${(b.instructions || []).map(fmtInstr).join("")}</ol>`;
    tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + w > innerWidth - 8) x = Math.max(8, e.clientX - w - 14);
    if (y + h > innerHeight - 8) y = Math.max(8, e.clientY - h - 14);
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hideTip() { tip.hidden = true; }

  // ---------------------------------------------------------------- floor plan
  const nestEl = {};
  const instEl = {};
  const capEl = {};
  const chips = {};
  let elsewhere = null;

  function buildFloor() {
    const groups = {};
    instSorted.forEach(inst => { (groups[inst.type] = groups[inst.type] || []).push(inst); });
    const html = Object.entries(groups).map(([type, insts]) => `<div class="fgroup"><h3>${esc(TYPE_LABEL[type] || type)}</h3><div class="members">${
      insts.map(inst => {
        const wide = type === "storage" || type === "hotel";
        const cap = inst.nests.reduce((a, n) => a + n.capacity, 0);
        const slots = inst.nests.map(n => {
          const suffix = n.id.includes(".") ? n.id.slice(n.id.indexOf(".") + 1) : "";
          return `<div class="slot" data-nest="${esc(n.id)}">${suffix ? `<span class="sl">${esc(suffix)}</span>` : ""}</div>`;
        }).join("");
        return `<div class="inst${wide ? " wide" : ""}" data-inst="${esc(inst.id)}">
          <div class="ih"><span style="color:${instColor(inst.id)}">■</span>${esc(inst.id)}${wide ? `<span class="cap" data-cap="${esc(inst.id)}"></span>` : ""}</div>
          <div class="now"></div>${slots ? `<div class="slots">${slots}</div>` : ""}</div>`;
      }).join("")}</div></div>`).join("");
    $("#floor").innerHTML = html + `<div class="fgroup" data-elsewhere hidden><h3>elsewhere</h3><div class="members"><div class="inst"><div class="slots"><div class="slot" data-nest=""></div></div></div></div></div>`;
    $$("#floor [data-nest]").forEach(el => { nestEl[el.dataset.nest] = el; });
    $$("#floor [data-inst]").forEach(el => { instEl[el.dataset.inst] = { el, now: $(".now", el) }; });
    $$("#floor [data-cap]").forEach(el => { capEl[el.dataset.cap] = el; });
    elsewhere = nestEl[""];
    delete nestEl[""];
    const after = document.createElement("div");
    after.className = "floor-note";
    after.id = "floor-note";
    $("#floor").after(after);

    const plates = new Set();
    D.runs.forEach(r => Object.keys(r.initial_locations).forEach(p => plates.add(p)));
    D.runs.forEach(r => r.moves.forEach(m => plates.add(m.plate)));
    [...plates].sort().forEach(p => {
      const c = document.createElement("span");
      const owner = plateOwner[p];
      c.className = "plate";
      c.textContent = p;
      if (owner === undefined) {
        c.classList.add("borrowed");
        c.title = `${p} · borrowed by ${(plateBorrowers[p] || []).join(", ") || "—"}`;
      } else {
        c.style.background = wfColor(owner);
        if (wfDarkInk(owner)) c.classList.add("dark-ink");
        const b = plateBorrowers[p];
        c.title = `${p} · owned by ${D.workflows[owner].id}${b ? " · borrowed by " + b.join(", ") : ""}`;
      }
      chips[p] = c;
    });
  }

  function plateLoc(run, p, plate, t) {
    const ms = p.plateMoves[plate];
    if (ms) {
      const k = lastAtOrBefore(ms, "time", t);
      if (k >= 0) return ms[k].dst;
    }
    return run.initial_locations[plate];
  }

  function updateFloor(t, animate) {
    const run = R(), p = P();
    const moved = [];
    for (const plate in chips) {
      const c = chips[plate];
      const loc = plateLoc(run, p, plate, t);
      const key = loc === undefined ? "∅" : loc;
      if (c.dataset.loc === key) continue;
      moved.push([c, loc, animate ? c.getBoundingClientRect() : null]);
    }
    moved.forEach(([c, loc]) => {
      if (loc === undefined) { c.remove(); c.dataset.loc = "∅"; return; }
      (nestEl[loc] || elsewhere).appendChild(c);
      c.dataset.loc = loc;
    });
    if (animate && moved.length && moved.length <= 40) {
      moved.forEach(([c, loc, first]) => {
        if (!first || loc === undefined || !first.width) return;
        const last = c.getBoundingClientRect();
        const dx = first.left - last.left, dy = first.top - last.top;
        if (!dx && !dy) return;
        c.style.transition = "none";
        c.style.transform = `translate(${dx}px, ${dy}px)`;
        c.getBoundingClientRect();
        c.style.transition = "transform .45s cubic-bezier(.3,.7,.3,1)";
        c.style.transform = "";
      });
    }
    if (moved.length) {
      elsewhere.closest("[data-elsewhere]").hidden = !elsewhere.children.length;
      for (const id in capEl) {
        const inst = instById[id];
        const n = inst.nests.reduce((a, ns) => a + (nestEl[ns.id] ? nestEl[ns.id].querySelectorAll(".plate").length : 0), 0);
        capEl[id].textContent = `${n} / ${inst.nests.reduce((a, ns) => a + ns.capacity, 0)}`;
      }
    }
    for (const id in instEl) {
      const arr = p.instBlocks[id] || [];
      const k = lastAtOrBefore(arr, "start", t);
      const b = k >= 0 && arr[k].end > t ? arr[k] : null;
      const ie = instEl[id];
      const isBusy = !!b;
      if (ie.el.classList.contains("busy") !== isBusy) ie.el.classList.toggle("busy", isBusy);
      const txt = b ? `${b.workflow} · ${b.label}` : "idle";
      if (ie.now.textContent !== txt) { ie.now.textContent = txt; ie.now.title = txt; }
    }
    const note = $("#floor-note");
    let msg = "";
    if (run.deadlock && t >= run.deadlock.time) msg = `Deadlocked at t=${run.deadlock.time}: ${run.deadlock.waits.length} blocks waiting, nothing can move.`;
    if (run.alarm && t >= run.alarm.time) msg = `Alarm at t=${run.alarm.time}: ${run.alarm.message}`;
    if (note.textContent !== msg) note.textContent = msg;
  }

  // ---------------------------------------------------------------- time / transport
  const scrub = $("#scrub");
  const fill = $(".scrub-fill", scrub), knob = $(".scrub-knob", scrub);

  function setTime(t, animate) {
    const T = P().T;
    S.t = Math.min(T, Math.max(0, t));
    const x = pct(S.t, T);
    S.cursors.forEach(c => { c.style.left = x; });
    fill.style.width = x; knob.style.left = x;
    scrub.setAttribute("aria-valuenow", Math.floor(S.t));
    $("#tnow").textContent = `t = ${Math.floor(S.t)} / ${T} min`;
    updateFloor(S.t, animate);
    if (S.playing && S.zoom > 1) follow();
  }
  function follow() {
    $$(".gantt .g-scroll").forEach(sc => {
      const inner = sc.firstElementChild;
      const lw = parseFloat(getComputedStyle(inner).getPropertyValue("--label-w")) || 132;
      const x = lw + (inner.offsetWidth - lw - 10) * S.t / P().T;
      if (x < sc.scrollLeft + lw || x > sc.scrollLeft + sc.clientWidth - 40) sc.scrollLeft = x - lw - 40;
    });
  }

  function renderScrubMarkers() {
    const T = P().T;
    $(".scrub-markers", scrub).innerHTML = P().markers.map(m =>
      `<div class="mk" style="left:${pct(m.time, T)}" title="${esc(m.label)}"></div>`).join("");
    scrub.setAttribute("aria-valuemax", T);
  }
  let scrubDrag = false;
  const scrubTo = e => { const r = scrub.getBoundingClientRect(); setTime((e.clientX - r.left) / r.width * P().T); };
  scrub.addEventListener("pointerdown", e => { scrubDrag = true; scrub.setPointerCapture(e.pointerId); scrubTo(e); });
  scrub.addEventListener("pointermove", e => { if (scrubDrag) scrubTo(e); });
  scrub.addEventListener("pointerup", () => { scrubDrag = false; });
  scrub.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      setTime(Math.round(S.t) + (e.key === "ArrowLeft" ? -1 : 1) * (e.shiftKey ? 10 : 1), true);
      e.preventDefault(); e.stopPropagation();
    }
  });

  const speedSel = $("#speed");
  speedSel.innerHTML = SPEEDS.map(s => `<option value="${s}">${s} min/s</option>`).join("");
  speedSel.addEventListener("change", () => { S.speed = +speedSel.value; S.speedTouched = true; });
  function autoSpeed() {
    if (S.speedTouched) return;
    const T = P().T;
    S.speed = SPEEDS.find(s => s >= T / 20) || SPEEDS[SPEEDS.length - 1];
    speedSel.value = String(S.speed);
  }

  const playBtn = $("#play");
  let last = null;
  function tick(ts) {
    if (!S.playing) return;
    if (last !== null) {
      const T = P().T;
      const nt = S.t + (ts - last) / 1000 * S.speed;
      setTime(nt, true);
      if (nt >= T) { setPlaying(false); return; }
    }
    last = ts;
    requestAnimationFrame(tick);
  }
  function setPlaying(on) {
    S.playing = on;
    playBtn.classList.toggle("playing", on);
    playBtn.setAttribute("aria-label", on ? "Pause" : "Play");
    if (on) {
      if (S.t >= P().T) setTime(0);
      last = null;
      requestAnimationFrame(tick);
    }
  }
  playBtn.addEventListener("click", () => setPlaying(!S.playing));

  document.addEventListener("keydown", e => {
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea") return;
    if (e.key === " " && tag !== "button") { setPlaying(!S.playing); e.preventDefault(); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      setTime(Math.round(S.t) + (e.key === "ArrowLeft" ? -1 : 1) * (e.shiftKey ? 10 : 1), true);
      e.preventDefault();
    } else if (e.key === "Escape") select(null);
  });

  $$(".zoom [data-zoom]").forEach(b => b.addEventListener("click", () => {
    S.zoom = +b.dataset.zoom;
    $$(".zoom [data-zoom]").forEach(x => x.classList.toggle("on", x === b));
    renderGantts();
    setTime(S.t);
  }));
  $('.zoom [data-zoom="1"]').classList.add("on");

  // ---------------------------------------------------------------- source
  function showSource(key) {
    $$("#src-tabs .subtab").forEach(b => b.classList.toggle("on", b.dataset.src === key));
    $("#src").innerHTML = D.sources[key] || `<p class="muted">(no ${esc(key)} source provided)</p>`;
  }
  $("#src-tabs").addEventListener("click", e => {
    const b = e.target.closest("[data-src]");
    if (b) showSource(b.dataset.src);
  });

  // ---------------------------------------------------------------- compiled
  const rowEl = {};
  function renderCompiled() {
    const wfMeta = Object.fromEntries(D.workflows.map(w => [w.id, w]));
    const chip = (p) => {
      const o = plateOwner[p];
      return o === undefined
        ? `<span class="plate borrowed">${esc(p)}</span>`
        : `<span class="plate${wfDarkInk(o) ? " dark-ink" : ""}" style="background:${wfColor(o)}">${esc(p)}</span>`;
    };
    const short = id => id.slice(id.lastIndexOf("/") + 1);
    $("#compiled").innerHTML = D.compiled.map((c, ci) => {
      const w = wfMeta[c.workflow] || { id: c.workflow, name: "", args: {}, owned: [], borrowed: [] };
      const i = wfIndex[c.workflow] || 0;
      const call = `${esc(w.name)}(${Object.entries(w.args).map(([k, v]) => `${esc(k)}=${esc(JSON.stringify(v))}`).join(", ")})`;
      const vars = Object.entries(c.variables).map(([v, cands]) =>
        `<span><b>${esc(v)}</b> ∈ {${cands.map(esc).join(", ")}} ${D.runs.map((r, ri) => {
          const val = (r.bindings[c.workflow] || {})[v];
          return `<span class="bind" data-bind-run="${ri}" title="${esc(r.mode)}">${esc(r.mode)} → ${esc(val || "—")}</span>`;
        }).join(" ")}</span>`).join("");
      const rows = c.blocks.map(b => {
        const res = b.instruments.map(x => `<span class="rchip${x.startsWith("?") ? " var" : ""}" style="border-color:${x.startsWith("?") ? "var(--muted)" : instColor(x)}">${esc(x)}</span>`).join("")
          + b.plates.map(chip).join("");
        return `<tr class="blk" data-blk="${esc(b.id)}"><td class="bid">${esc(short(b.id))}</td><td><span class="kind">${esc(b.kind)}</span></td>
          <td>${esc(b.label)}</td><td class="dur">${b.duration}m</td>
          <td class="deps">${b.deps.map(d => `<a data-dep="${esc(d)}">${esc(short(d))}</a>`).join(" ") || '<span class="muted">—</span>'}</td>
          <td><div class="res">${res}</div></td><td><ol class="instr">${b.instructions.map(fmtInstr).join("")}</ol></td></tr>`;
      }).join("");
      return `<details class="wf" data-wf="${esc(c.workflow)}"${ci === 0 ? " open" : ""}>
        <summary><span class="wf-id"><span class="sw" style="background:${wfColor(i)}"></span>${esc(c.workflow)}</span>
          <span class="wf-call">${call}</span>
          <span class="pchips">${w.owned.map(chip).join("")}${w.borrowed.map(chip).join("")}</span>
          <span class="muted small">${c.blocks.length} blocks</span></summary>
        ${vars ? `<div class="vars">${vars}</div>` : ""}
        <table class="blocks"><thead><tr><th>id</th><th>kind</th><th>label</th><th>dur</th><th>deps</th><th>resources</th><th>instructions</th></tr></thead>
        <tbody>${rows}</tbody></table></details>`;
    }).join("");
    $$("#compiled tr.blk").forEach(tr => { rowEl[tr.dataset.blk] = tr; });
    $("#compiled").addEventListener("click", e => {
      const dep = e.target.closest("[data-dep]");
      if (dep) { select(dep.dataset.dep, true, false); e.stopPropagation(); return; }
      const tr = e.target.closest("tr.blk");
      if (tr) select(tr.dataset.blk, false, false);
    });
  }
  function markCompiledForRun() {
    const run = R();
    const waiting = new Set(run.deadlock ? run.deadlock.waits.map(w => baseId(w.block)) : []);
    const cycle = new Set([...P().cycle].map(baseId));
    const ran = new Set(run.blocks.map(b => baseId(b.id)));
    for (const id in rowEl) {
      rowEl[id].classList.toggle("waiting", waiting.has(id));
      rowEl[id].classList.toggle("cycle", cycle.has(id));
      rowEl[id].classList.toggle("notrun", run.blocks.length > 0 && !ran.has(id) && !waiting.has(id));
    }
    $$("#compiled .bind").forEach(el => { el.style.fontWeight = +el.dataset.bindRun === S.run ? "600" : ""; el.style.opacity = +el.dataset.bindRun === S.run ? "1" : ".6"; });
  }

  // ---------------------------------------------------------------- selection (cross-links)
  function select(id, scrollCompiled, toggle) {
    if (toggle && id === S.sel) id = null;
    S.sel = id;
    applySelection(scrollCompiled);
  }
  function applySelection(scrollCompiled) {
    const id = S.sel;
    $$(".bar.sel").forEach(b => b.classList.remove("sel"));
    $$("#compiled tr.sel").forEach(r => r.classList.remove("sel"));
    $$(".plate.sel").forEach(c => c.classList.remove("sel"));
    $$(".g-inner").forEach(g => g.classList.toggle("has-sel", !!id));
    if (!id) return;
    const bars = $$(`.bar[data-b="${attr(id)}"]`);
    bars.forEach(b => b.classList.add("sel"));
    if (!bars.length) $$(".g-inner").forEach(g => g.classList.remove("has-sel"));
    const b = P().byId[id] || compiledById[baseId(id)];
    if (b) (b.plates || []).forEach(pl => { if (chips[pl]) chips[pl].classList.add("sel"); });
    const tr = rowEl[id] || rowEl[baseId(id)];
    if (tr) {
      tr.classList.add("sel");
      if (scrollCompiled) {
        tr.closest("details").open = true;
        tr.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    }
  }

  // ---------------------------------------------------------------- run switching
  function setRun(i) {
    S.run = i;
    renderTabs();
    markStatsActive();
    renderAlerts();
    const run = R();
    const unsolved = run.status === "no_solution" || run.status === "infeasible";
    const none = unsolved || (!run.blocks.length && !run.deadlock && !run.alarm);
    $("#run-views").hidden = none;
    $("#run-empty").hidden = !none;
    if (none) {
      const why = run.status === "infeasible"
        ? "the model was proven infeasible"
        : "no feasible plan was found before the solver stopped";
      $("#run-empty").innerHTML = unsolved
        ? `<b>${run.status === "infeasible" ? "Infeasible" : "No solution"}</b>The ${esc(run.mode)} planner found no schedule: ${why} (solver status ${esc(run.solver_status || "unknown")}). Nothing was executed, so there are no charts for this mode.`
        : `<b>Nothing ran</b>This run executed no blocks.`;
    }
    renderUtil();
    renderLegends();
    renderGantts();
    renderScrubMarkers();
    markCompiledForRun();
    autoSpeed();
    for (const p in chips) delete chips[p].dataset.loc;
    setTime(Math.min(S.t, P().T));
  }

  // ---------------------------------------------------------------- init
  renderStats();
  buildFloor();
  renderCompiled();
  showSource("workflows");
  setRun(0);
})();
</script>
</body>
</html>
